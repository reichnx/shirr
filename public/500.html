<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>500 - Facebook Share Booster</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23667eea'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-weight='bold'%3EFS%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container { text-align: center; padding: 2rem; max-width: 400px; }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
        }
        .error-code { font-size: 5rem; font-weight: 800; color: #ff6666; }
        .error-icon { font-size: 3rem; color: #ff6666; margin: 1rem 0; }
        h1 { color: #fff; font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: rgba(255, 255, 255, 0.6); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="glass-card">
            <div class="error-code">500</div>
            <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h1>Server Error</h1>
            <p>Something went wrong on our end. Please try again later.</p>
            <a href="/" class="btn-home"><i class="fas fa-home"></i> Return Home</a>
        </div>
    </div>
</body>
</html>
